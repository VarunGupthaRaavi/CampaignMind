version: '3.8'

services:
  # Backend Development Mode with Volume Mounts & Uvicorn Hot-Reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campaignmind-backend-dev
    command: ["sh", "-c", "uvicorn app.main:app --reload --host 0.0.0.0 --port ${BACKEND_PORT:-8000}"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - PORT=${BACKEND_PORT:-8000}
      - ENVIRONMENT=development
      - DEBUG=true
      - API_V1_STR=/api/v1
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-2.5-flash}
      - SECRET_KEY=${SECRET_KEY}

  # Frontend Development Mode with Volume Mounts & Vite Hot-Reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: campaignmind-frontend-dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT:-8000}/api/v1
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
